ll:
  services:
    diff_drive:
      wheel_distance_m: 0.325
      ticks_per_m: 1600.0
      # Drive control mode:
      #   duty      - open-loop duty (default, unchanged behavior)
      #   duty_loop - firmware PI on measured wheel speed -> duty (opt-in, to try)
      control_mode: duty
      # Translation of the normalized [-1,1] high-level twist to the physical units the
      # firmware now expects. Full-scale command (1.0) -> these real speeds. Defaults
      # reproduce the legacy behaviour; the firmware safety-caps well above these.
      max_linear_speed: 0.5    # m/s at full command
      max_angular_speed: 0.5   # rad/s at full command
    power:
      battery_full_voltage: 27.0
      battery_empty_voltage: 24.0
      battery_critical_voltage: 23.0
      battery_critical_high_voltage: 29.0
      charge_critical_high_voltage: 30.0
      charge_critical_high_current: 1.5
    input:
      config_file: /opt/open_mower_ros/src/open_mower/params/hardware_specific/YardForce500/inputs.yaml

xbot_positioning:
  antenna_offset_x: 0.3
  antenna_offset_y: 0.0
