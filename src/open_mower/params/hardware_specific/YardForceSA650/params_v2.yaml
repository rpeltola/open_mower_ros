ll:
  services:
    diff_drive:
      wheel_distance_m: 0.325
      ticks_per_m: 1964.0
      # Power down the drive ESCs when idle and the tilt is below this many
      # degrees, so they cool down. Above it the wheels keep holding torque so
      # the mower can't roll on a slope. 0 disables the feature.
      shutdown_esc_max_pitch: 20
    power:
      battery_full_voltage: 27.0
      battery_empty_voltage: 24.0
      battery_critical_voltage: 23.0
      battery_critical_high_voltage: 29.0
      charge_critical_high_voltage: 30.0
      charge_critical_high_current: 1.5
    input:
      config_file: /opt/open_mower_ros/src/open_mower/params/hardware_specific/YardForceSA650/inputs.yaml

xbot_positioning:
  antenna_offset_x: 0.1
  antenna_offset_y: 0.0
