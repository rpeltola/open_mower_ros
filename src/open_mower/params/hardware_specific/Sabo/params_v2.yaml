ll:
  services:
    diff_drive:
      wheel_distance_m: 0.45
      ticks_per_m: 1195.0
      # Drive control mode:
      #   duty      - open-loop duty (default, unchanged behavior)
      #   duty_loop - firmware PI on measured wheel speed -> duty (opt-in, to try)
      control_mode: duty
      # Translation of the normalized [-1,1] high-level twist to the physical units the
      # firmware now expects. Full-scale command (1.0) -> these real speeds. Defaults
      # reproduce the legacy behaviour; the firmware safety-caps well above these.
      max_linear_speed: 0.5    # m/s at full command
      max_angular_speed: 0.5   # rad/s at full command
    gps:
      protocol: "NMEA"
      baudrate: 921600
    imu:
      axis_config: "+Z+X+Y"
    power:
      battery_empty_voltage: 23.5
      battery_critical_voltage: 22.5
      battery_full_voltage: 28.5
      battery_critical_high_voltage: 29.0
      charge_critical_high_voltage: 38.0
      charge_critical_high_current: 3.9
      charge_current: 2.5
    input:
      config_file: /opt/open_mower_ros/src/open_mower/params/hardware_specific/Sabo/inputs.yaml

xbot_positioning:
  antenna_offset_x: 0.18
  antenna_offset_y: 0.0

mower_logic:
  tool_width: 0.28
